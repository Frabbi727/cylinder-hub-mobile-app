<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CylinderHub — Splash & Onboarding</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="salesman/app.css" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0e18; }
    #root { min-height: 100%; }

    /* —— splash —— */
    .ob-splash .ob-bloom { position: absolute; border-radius: 50%; background: rgba(255,255,255,0.10); z-index: 1; }
    .ob-logo { position: relative; display: inline-flex; animation: obLogoIn 700ms cubic-bezier(.22,1,.3,1) both; }
    .ob-logo-glow { position: absolute; inset: -14px; border-radius: 38px; background: rgba(255,255,255,0.18); filter: blur(14px); animation: obPulse 2400ms ease-in-out infinite; }
    @keyframes obLogoIn { from { transform: scale(0.6); } to { transform: scale(1); } }
    @keyframes obPulse { 0%,100% { transform: scale(1); opacity: 0.5; } 50% { transform: scale(1.12); opacity: 0.85; } }
    .ob-fade-up { animation: obFadeUp 700ms 260ms cubic-bezier(.22,1,.3,1) both; }
    @keyframes obFadeUp { from { transform: translateY(14px); } to { transform: translateY(0); } }
    .ob-dots-load { display: flex; gap: 7px; }
    .ob-dots-load span { width: 8px; height: 8px; border-radius: 99px; background: rgba(255,255,255,0.55); animation: obBounce 1100ms ease-in-out infinite; }
    .ob-dots-load span:nth-child(2) { animation-delay: 160ms; }
    .ob-dots-load span:nth-child(3) { animation-delay: 320ms; }
    @keyframes obBounce { 0%,100% { transform: translateY(0); opacity: 0.5; } 50% { transform: translateY(-6px); opacity: 1; } }

    /* —— onboarding artwork stage —— */
    .ob-art { position: relative; width: 300px; height: 300px; display: flex; align-items: center; justify-content: center; }
    .ob-art::before { content: ''; position: absolute; width: 246px; height: 246px; border-radius: 42% 58% 56% 44% / 52% 44% 56% 48%; background: linear-gradient(150deg, var(--g1), var(--g2)); opacity: 0.14; }
    .ob-art::after  { content: ''; position: absolute; width: 200px; height: 200px; border-radius: 50%; border: 1.5px dashed var(--g1); opacity: 0.28; animation: obSpin 26s linear infinite; }
    @keyframes obSpin { to { transform: rotate(360deg); } }
    .ob-card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 18px 40px rgba(30,40,80,0.18); position: relative; z-index: 2; }
    .ob-stack { position: relative; z-index: 2; }
    .ob-hero { width: 234px; border-radius: 20px; padding: 16px 18px; color: #fff; position: relative; overflow: hidden; z-index: 2;
               background: linear-gradient(135deg,#FF8A4B,#F2563E); box-shadow: 0 18px 38px -10px rgba(242,86,62,0.55); }
    .ob-hero::after { content:''; position:absolute; right:-30px; top:-30px; width:120px; height:120px; border-radius:50%; background:rgba(255,255,255,0.14); }
    .ob-hero .lbl { font-size: 12.5px; font-weight: 600; opacity: 0.92; display:flex; align-items:center; gap:6px; }
    .ob-hero .num { font-size: 32px; font-weight: 800; letter-spacing: -0.025em; margin-top: 6px; }
    .ob-hero .foot { display:flex; gap: 24px; margin-top: 14px; position: relative; z-index: 1; }
    .ob-hero .foot .k { font-size: 10.5px; opacity: 0.82; font-weight: 600; }
    .ob-hero .foot .v { font-size: 15px; font-weight: 800; margin-top: 2px; }
    .ob-badge { position: absolute; width: 56px; height: 56px; border-radius: 18px; display: inline-flex; align-items: center; justify-content: center; z-index: 3; box-shadow: 0 12px 26px rgba(0,0,0,0.22), inset 0 1px 1px rgba(255,255,255,0.35); }

    /* floating positions + gentle bob */
    .ob-float-a { animation: obBob 4.4s ease-in-out infinite; }
    .ob-float-b { top: 30px; right: 14px; animation: obBob 3.6s ease-in-out infinite reverse; }
    .ob-float-c { position: absolute; bottom: 30px; left: 8px; animation: obBob 5s ease-in-out infinite; }
    @keyframes obBob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

    /* slide enter */
    .ob-slide-in { animation: obSlideIn 420ms cubic-bezier(.22,.9,.3,1) both; }
    @keyframes obSlideIn { from { transform: translateX(22px); } to { transform: translateX(0); } }

    /* page dots */
    .ob-pdots { display: flex; gap: 7px; align-items: center; }
    .ob-pdots span { width: 8px; height: 8px; border-radius: 99px; background: var(--line); transition: all 240ms; cursor: pointer; }
    .ob-pdots span.on { width: 24px; background: var(--blue); }

    @media (prefers-reduced-motion: reduce) {
      .ob-logo, .ob-fade-up, .ob-slide-in, .ob-float-a, .ob-float-b, .ob-float-c, .ob-logo-glow, .ob-dots-load span, .ob-art::after { animation: none !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <template id="__bundler_thumbnail">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
      <rect width="100" height="100" fill="#3D6BFF"/>
      <rect x="34" y="26" width="32" height="44" rx="10" fill="#fff"/>
      <path d="M50 40c-4 4-5.5 6.5-5.5 9.5a5.5 5.5 0 0 0 11 0c0-3-1.5-5.5-5.5-9.5z" fill="#FF7A45"/>
    </svg>
  </template>

  <script type="text/babel" src="src/icons.jsx"></script>
  <script type="text/babel" src="src/data.jsx"></script>
  <script type="text/babel" src="salesman/sdata.jsx"></script>
  <script type="text/babel" src="salesman/ios-frame.jsx"></script>
  <script type="text/babel" src="salesman/screens-onboarding.jsx"></script>

  <script type="text/babel">
    const { useState } = React;

    function Flow() {
      const [stage, setStage] = useState('splash'); // splash | onboarding | done
      const [lang, setLangState] = useState(0);
      const setLang = (i) => { setLangIdx(i); setLangState(i); };

      let screen;
      if (stage === 'splash') {
        screen = <Splash lang={lang} setLang={setLang} onDone={() => setStage('onboarding')} />;
      } else if (stage === 'onboarding') {
        screen = <Onboarding lang={lang} setLang={setLang} onDone={() => setStage('done')} />;
      } else {
        screen = <Done lang={lang} onReplay={() => setStage('splash')} />;
      }

      return (
        <div style={{
          minHeight: '100vh', width: '100%',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          padding: 28, boxSizing: 'border-box',
          background: 'radial-gradient(120% 90% at 50% 0%, #232a44 0%, #131726 55%, #0b0e18 100%)',
        }}>
          <IOSDevice dark width={402} height={874}>
            <div style={{ display: 'contents' }} data-theme="light">{screen}</div>
          </IOSDevice>
        </div>
      );
    }

    // simple handoff confirmation so the flow is reviewable end-to-end
    function Done({ lang, onReplay }) {
      const Ic = window.Icons;
      return (
        <div className="sm-root" style={{ background: 'linear-gradient(160deg,#3D6BFF 0%,#6C4DF6 100%)', alignItems: 'center', justifyContent: 'center' }}>
          <div className="ob-fade-up" style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 16, textAlign: 'center', padding: 26 }}>
            <div style={{ width: 84, height: 84, borderRadius: 26, background: 'rgba(255,255,255,0.2)', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', boxShadow: '0 14px 34px rgba(0,0,0,0.22)' }}>
              <Ic.Check size={44} style={{ color: '#fff' }} />
            </div>
            <div>
              <div style={{ color: '#fff', fontSize: 25, fontWeight: 800, letterSpacing: '-0.02em' }}>
                {lang === 1 ? 'আপনি প্রস্তুত!' : "You're all set!"}
              </div>
              <div style={{ color: 'rgba(255,255,255,0.82)', fontSize: 14.5, fontWeight: 600, marginTop: 6 }}>
                {lang === 1 ? 'লগইন স্ক্রিনে যাচ্ছেন…' : 'Continuing to the login screen…'}
              </div>
            </div>
          </div>
          <div style={{ paddingBottom: 54 }}>
            <button className="btn btn-ghost" style={{ background: 'rgba(255,255,255,0.18)', color: '#fff' }} onClick={onReplay}>
              <Ic.RotateCcw size={17} /> {lang === 1 ? 'আবার দেখুন' : 'Replay flow'}
            </button>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Flow />);
  </script>
</body>
</html>
